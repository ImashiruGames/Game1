<!doctype html><html lang="ja"><meta charset="UTF-8"><title>ルビィ 炎の隕石演出確認</title><style>body{margin:16px;background:#101922;color:#edf5fa;font:14px system-ui}button,select{padding:10px;margin:4px}main{display:flex;gap:16px}iframe{border:1px solid #678;width:375px;height:667px}pre{white-space:pre-wrap;max-width:500px}h1{font-size:19px}</style><h1>ルビィ：イラスト → 炎の隕石（隔離プレビュー・保存なし）</h1><label>速度<select id="pace"><option value="medium">中</option><option value="slow">遅</option><option value="fast">速</option></select></label><label><input type="checkbox" id="reduced">reduced motion</label><label><input type="checkbox" id="short">演出短縮</label><button id="play">一連の演出を再生</button><button id="cancel">中断</button><label>静止確認<select id="still"><option value="">選択</option><option value=".2">降り始め 20%</option><option value=".48">降下 48%</option><option value=".68">炎の隕石 68%</option><option value=".87">残光 87%</option></select></label><label>画面<select id="size"><option>375x667</option><option>375x568</option><option>320x568</option><option>390x844</option><option>667x375</option></select></label><main><iframe id="frame" src="./frame.html" title="保存なしのルビィ変化確認"></iframe><pre id="log">準備中</pre></main><script type="module">const el=id=>document.getElementById(id),frame=el('frame');const send=data=>frame.contentWindow.postMessage(data,location.origin);el('play').onclick=()=>send({kind:'play',speed:el('pace').value,lowMotion:el('reduced').checked,short:el('short').checked});el('cancel').onclick=()=>send({kind:'cancel'});el('still').onchange=()=>send({kind:'still',p:Number(el('still').value),lowMotion:el('reduced').checked,short:el('short').checked||el('pace').value==='fast'});el('size').onchange=()=>{const [w,h]=el('size').value.split('x');frame.style.width=w+'px';frame.style.height=h+'px';};window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data.kind==='status')el('log').textContent=e.data.text;});</script></html>
