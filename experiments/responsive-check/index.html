<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game1 responsive viewport check</title><style>body{margin:16px;background:#101922;color:#eef5fa;font:14px system-ui}label{display:inline-block;margin:5px}button,select{font:inherit;padding:8px;background:#243b4b;color:inherit;border:1px solid #7691a3;border-radius:5px}main{display:flex;gap:18px;align-items:flex-start}iframe{border:1px solid #789;flex:none;background:#14212c}pre{white-space:pre-wrap;max-width:520px;font-size:12px}h1{font-size:20px}</style><h1>小型iPhone CSS viewport検証（実機Safariではありません）</h1><label>画面<select id="view"><option value="home">トップ</option><option value="long-home">長い名前と大きい所持数</option><option value="deep-home">深層開始ホーム</option><option value="battle">戦闘</option><option value="damage-left">左端ダメージ</option><option value="damage-right">右端大ダメージ</option><option value="damage-large">最大桁数ダメージ</option><option value="home-dialog">ホームのモーダル</option><option value="skill-dialog">スキルモーダル</option></select></label><label>CSS viewport<select id="size"><option>375x667</option><option>375x568</option><option>375x600</option><option>414x736</option><option>375x812</option><option>390x844</option><option>393x852</option><option>390x600</option><option>390x640</option><option>320x568</option><option>667x375</option><option>736x414</option></select></label><button id="audit">全サイズの寸法を検証</button><button id="measure">再計測</button><main><iframe id="frame" title="独立したゲーム表示" width="375" height="667"></iframe><pre id="result">準備中</pre></main><script type="module">
const frame=document.querySelector('#frame'),view=document.querySelector('#view'),size=document.querySelector('#size'),result=document.querySelector('#result');let seq=0,pending,results=[];
function show(){const [w,h]=size.value.split('x').map(Number);frame.width=w;frame.height=h;frame.src='./frame.html?view='+view.value+'&seq='+(++seq);result.textContent='計測中';}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.kind!=='layout-result')return;result.textContent=JSON.stringify(e.data.report,null,2);pending?.(e.data.report);pending=null;});
view.onchange=show;size.onchange=()=>{const [w,h]=size.value.split('x').map(Number);frame.width=w;frame.height=h;setTimeout(()=>frame.contentWindow.postMessage({kind:'measure'},location.origin),180);};
document.querySelector('#measure').onclick=()=>frame.contentWindow.postMessage({kind:'measure'},location.origin);
document.querySelector('#audit').onclick=async()=>{results=[];document.querySelector('#audit').disabled=true;for(const v of ['home','long-home','deep-home','battle','damage-left','damage-right','damage-large','home-dialog','skill-dialog'])for(const s of Array.from(size.options).map(o=>o.value)){view.value=v;size.value=s;const report=await new Promise(resolve=>{pending=resolve;show();});results.push(report);}result.textContent=JSON.stringify({cases:results.length,failures:results.filter(r=>r.failures.length).map(r=>({view:r.view,viewport:r.viewport,failures:r.failures})),scrollable:results.filter(r=>r.scrollable).map(r=>({view:r.view,viewport:r.viewport,scrollHeight:r.scrollHeight})),passed:results.filter(r=>!r.failures.length).length},null,2);document.querySelector('#audit').disabled=false;const summary=document.createElement('pre');summary.id='audit-summary';summary.textContent=result.textContent;document.querySelector('main').after(summary);const blob=new Blob([JSON.stringify(results,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='responsive-results.json';a.textContent='寸法結果JSONを保存';document.querySelector('main').before(a);};
show();
</script></html>
