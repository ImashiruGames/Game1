<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青の子：癒やしから攻撃へ · 比較プレビュー</title><style>body{margin:0;padding:24px;background:#10202b;color:#e8f7ff;font:15px system-ui}h1{font-size:23px}p{color:#b2cedb;line-height:1.6}main{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}aside{max-width:480px}label{display:block;margin:12px 0}button,select{padding:9px;margin:3px;font:inherit;color:inherit;background:#203b4c;border:1px solid #62899b;border-radius:6px}button{cursor:pointer}iframe{border:1px solid #587b8e;border-radius:12px;background:#10202b}pre{font:13px system-ui;white-space:pre-wrap;color:#c4e7f6}fieldset{border:1px solid #416479;border-radius:8px;margin:16px 0}</style><h1>青の子：波紋から、回復スキルへ</h1><p>採用済みA改は装備中の回復HUDへ光を届け、到着先にも小さな波紋を広げます。原案A/B/Cも残しています。通常の追加演出は1.3秒。A改は本編1.14.12へ採用済みです。</p><main><iframe id="frame" src="./frame.html" width="375" height="667" title="青の子の変化・保存なし"></iframe><aside><label>比較案<select id="variant"><option value="skills">A改：回復スキルへ波紋</option><option value="ripple">A：波紋から光の帯</option><option value="tide">B：満ちる光から一筋の閃光</option><option value="petals">C：花びら状の光の収束</option></select></label><p>A：水滴と厚みのある波紋。B：下から満ちる柔らかな光。C：少数の丸い花びらが箱を包みます。最後は同じ光が敵へ向かいます。</p><label>装備・表示例<select id="example"><option value="multiple">回復3つ：ヘルス・救急箱・ポーション</option><option value="single">回復1つ：ヘルス＋非回復2つ</option><option value="mixed">混在：回復2つ＋魔法弾</option><option value="zero">対象ゼロ：HUD非表示</option></select></label><label>戦闘速度<select id="pace"><option value="medium">通常</option><option value="slow">ゆっくり</option><option value="fast">高速</option></select></label><label>観察倍率（追加演出）<select id="rate"><option value="1">1倍</option><option value=".25">0.25倍</option><option value=".1">0.1倍</option></select></label><label><input id="short" type="checkbox">演出短縮</label><label><input id="low" type="checkbox">低モーション</label><button id="play">イラストから再生</button><button id="effect">追加演出だけ再生</button><button id="pause">途中で停止</button><button id="resume">続きから再生</button><button id="cancel">中断</button><button id="home">終了・ホーム相当</button><fieldset><legend>同じ時刻で静止比較（最大60秒）</legend><button data-p=".48">盤面の波紋</button><button data-p=".76">収束・転換</button><button data-p=".87">光を届ける</button><button data-p=".96">到着・小波紋</button><button data-p="1">終了</button><label>進行 <input id="seek" type="range" min="0" max="100" value="48"><output id="percent">48%</output></label></fieldset><label>画面サイズ<select id="size"><option>375×667</option><option>320×568</option><option>390×844</option><option>667×375</option></select></label><pre id="log">準備中</pre><p>低モーション時は、盤面と各対象の静かな発光のみです。HP表示は演出で変化しません。</p></aside></main><script type="module">const $=id=>document.getElementById(id),frame=$('frame');let last='effect';function send(kind){if(['play','effect','still'].includes(kind))last=kind;frame.contentWindow.postMessage({kind,variant:$('variant').value,example:$('example').value,speed:$('pace').value,rate:Number($('rate').value),short:$('short').checked,lowMotion:$('low').checked,p:Number($('seek').value)/100},location.origin)}for(const id of ['play','effect','pause','resume','cancel','home'])$(id).onclick=()=>send(id);for(const b of document.querySelectorAll('[data-p]'))b.onclick=()=>{$('seek').value=Number(b.dataset.p)*100;$('percent').textContent=$('seek').value+'%';send('still')};$('seek').oninput=()=>{$('percent').textContent=$('seek').value+'%';send('still')};$('variant').onchange=$('example').onchange=()=>send(last==='still'?'still':'effect');$('size').onchange=()=>{const [w,h]=$('size').value.split('×');frame.width=w;frame.height=h};window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data.kind==='status')$('log').textContent=e.data.text});</script></html>
