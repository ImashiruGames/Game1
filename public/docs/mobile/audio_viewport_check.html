<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SE試聴資料 画面サイズ確認</title><style>body{margin:16px;background:#18242e;color:#eef4f7;font:14px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}button{min-height:44px;padding:10px;font:inherit;cursor:pointer}iframe{border:0;outline:1px solid #718595;width:390px;height:640px;display:block}p{max-width:620px}a{color:#aaddff}</style><header><strong>試聴資料の画面サイズ確認</strong><button data-width="390" data-height="640">390 × 640</button><button data-width="320" data-height="600">320 × 600</button><a href="/docs/audio/">試聴資料を直接開く</a></header><p>実際の試聴資料を指定サイズの枠内に表示しています。iOS Safariの実機確認ではありません。</p><iframe id="audition-frame" title="SE試聴資料のモバイル枠" src="/docs/audio/"></iframe><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const frame=document.getElementById('audition-frame');frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';}));</script></html>
