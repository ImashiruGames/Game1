<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ビルドカード 画面サイズ確認</title><style>body{margin:16px;background:#18242e;color:#eef4f7;font:14px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}button,select{min-height:44px;padding:10px;font:inherit;cursor:pointer}iframe{border:0;outline:1px solid #718595;width:390px;height:640px;display:block}p{max-width:740px}a{color:#aaddff}</style><header><strong>ビルドカードの画面確認</strong><button data-height="640">390 × 640</button><button data-height="600">390 × 600</button><label>表示例 <select id="example"><option value="stats">HP強化</option><option value="category">カテゴリ</option><option value="skills">固定ヘルス＋</option><option value="replace">自由枠の入替</option></select></label><a href="/build-card-preview/?mode=stats&amp;selected=max-health">PC表示を開く</a></header><p>新しい報酬カードの表示サンプルです。ゲームの保存・計算にはアクセスしません。iOS Safariの実機確認ではありません。</p><iframe id="card-frame" title="ビルドカードのモバイル枠" src="/build-card-preview/?mode=stats&amp;selected=max-health"></iframe><script>const frame=document.getElementById('card-frame');document.querySelectorAll('[data-height]').forEach(button=>button.addEventListener('click',()=>{frame.style.height=button.dataset.height+'px';}));document.getElementById('example').addEventListener('change',event=>{const examples={stats:'stats&selected=max-health',category:'category',skills:'skills&selected=health',replace:'replace&selected=square-strike&slot=1'};frame.src='/build-card-preview/?mode='+examples[event.target.value];});</script></html>
